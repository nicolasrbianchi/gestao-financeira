<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Finanças Mobile</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Controle financeiro</p>
        <h1>Finanças</h1>
      </div>
      <button class="icon-button" id="openSettings" aria-label="Configurações">⚙️</button>
    </header>

    <section class="month-card">
      <label for="monthInput">Mês</label>
      <input id="monthInput" type="month" />
    </section>

    <section class="hero-card">
      <p class="label">Saldo do mês</p>
      <strong id="balanceValue">R$ 0,00</strong>
      <div class="kpis">
        <div>
          <span>Receitas</span>
          <b id="incomeValue">R$ 0,00</b>
        </div>
        <div>
          <span>Despesas</span>
          <b id="expenseValue">R$ 0,00</b>
        </div>
      </div>
    </section>

    <section class="quick-actions">
      <button class="primary-button" id="newExpenseBtn">+ Despesa</button>
      <button class="secondary-button" id="newIncomeBtn">+ Receita</button>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>Gastos por categoria</h2>
        <small id="categoryTotalLabel">R$ 0,00</small>
      </div>
      <div id="categoryList" class="category-list empty">Sem dados para este mês.</div>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>Últimas transações</h2>
        <button class="text-button" id="refreshBtn">Atualizar</button>
      </div>
      <div id="recentList" class="recent-list empty">Nada lançado ainda.</div>
    </section>
  </main>

  <dialog id="entryDialog" class="bottom-sheet">
    <form id="entryForm" method="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="formTitle">Nova despesa</h2>
        <button type="button" class="icon-button" id="closeDialog">✕</button>
      </div>

      <input type="hidden" id="tipo" value="Despesa" />

      <label>
        Valor
        <input id="valor" inputmode="decimal" placeholder="Ex: 42,90" required />
      </label>

      <label>
        Nome
        <input id="nome" placeholder="Ex: Mercado, Uber, Farmácia" required />
      </label>

      <div class="grid-2">
        <label>
          Data
          <input id="data" type="date" required />
        </label>

        <label>
          Conta
          <select id="conta" required></select>
        </label>
      </div>

      <label>
        Categoria
        <select id="categoria" required></select>
      </label>

      <div class="grid-2">
        <label>
          Subcategoria
          <select id="subcategoria">
            <option value="">—</option>
            <option>Essencial</option>
            <option>Extra</option>
          </select>
        </label>

        <label>
          Forma
          <select id="forma">
            <option value="">—</option>
            <option>Pix</option>
            <option>Débito</option>
            <option>Crédito</option>
            <option>Depósito</option>
            <option>Dinheiro</option>
          </select>
        </label>
      </div>

      <details>
        <summary>Campos avançados</summary>

        <label>
          Reserva
          <select id="reserva">
            <option value="">—</option>
            <option>Entrada</option>
            <option>Saida</option>
          </select>
        </label>

        <label>
          Status
          <select id="status">
            <option>Pago em dia</option>
            <option>Pendente</option>
            <option>Recebido em dia</option>
          </select>
        </label>

        <label>
          Parcela
          <input id="parcela" placeholder="Ex: 1/3" />
        </label>

        <label>
          Observação
          <textarea id="obs" rows="2" placeholder="Opcional"></textarea>
        </label>
      </details>

      <button class="primary-button full" id="saveBtn" type="submit">Salvar lançamento</button>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="bottom-sheet">
    <form method="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2>Configurações</h2>
        <button type="button" class="icon-button" id="closeSettings">✕</button>
      </div>

      <label>
        URL do Apps Script
        <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec" />
      </label>

      <label>
        Token secreto
        <input id="apiToken" placeholder="mesmo token do Apps Script" />
      </label>

      <button class="primary-button full" id="saveSettings" type="button">Salvar configurações</button>
      <p class="hint">Esses dados ficam salvos apenas neste navegador/celular.</p>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
